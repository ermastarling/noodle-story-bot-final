version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    reviewers:
      - "ermastarling"
    labels:
      - "dependencies"
      - "security"
    versioning-strategy: "increase"
    commit-message:
      prefix: "deps"
      include: "scope"
    ignore:
      - dependency-name: "discord.js"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "better-sqlite3"
        update-types:
          - "version-update:semver-major"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:30"
      timezone: "UTC"
    open-pull-requests-limit: 5
    reviewers:
      - "ermastarling"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"
      include: "scope"
