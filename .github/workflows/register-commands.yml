name: Register Slash Commands

on:
  workflow_dispatch:
    inputs:
      guild:
        description: "Guild ID (leave blank to register global)"
        required: false
        default: ""

jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - run: npm ci
      - name: Register
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
          DISCORD_GUILD_ID: ${{ github.event.inputs.guild || secrets.DISCORD_GUILD_ID }}
          NODE_ENV: ${{ secrets.NODE_ENV || 'development' }}
        run: node src/register-commands.js
